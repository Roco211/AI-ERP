name: forge-erp-bootstrap
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env first}
      FORGE_APP_PASSWORD: ${FORGE_APP_PASSWORD:?Run make env first}
    ports: ["127.0.0.1:55438:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-forge.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
