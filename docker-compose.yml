name: forge-erp-bootstrap
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env first}
      FORGE_APP_PASSWORD: ${FORGE_APP_PASSWORD:?Run make env first}
    ports: ["127.0.0.1:55438:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-forge.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    profiles: [semantic]
    ports: ["127.0.0.1:11438:11434"]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: ["ollama_data:/root/.ollama"]
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  ollama_data:
  postgres_data:
  redis_data:
